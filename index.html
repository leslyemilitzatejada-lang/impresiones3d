<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impresiones 3D :D ✨</title>
    <style>
        /* Estilos con vibra escolar de 5to de primaria */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Ubuntu', sans-serif;
            background-color: #ffeb3b; /* Fondo amarillo brillante */
            background-image: radial-gradient(#ffca28 20%, transparent 20%),
                              radial-gradient(#ffca28 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #2c3e50;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* El contenedor principal tipo libreta */
        .contenedor {
            background-color: #ffffff;
            border: 6px solid #4caf50; /* Borde verde divertido */
            border-radius: 25px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0px 10px 0px #388e3c; /* Efecto 3D abajo */
            position: relative;
        }

        /* Título genial */
        h1 {
            color: #e91e63; /* Rosa brillante */
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #f8bbd0;
        }

        /* Subtítulo */
        .subtitulo {
            font-size: 1.2rem;
            color: #00bcd4; /* Azul cielo */
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Texto de bienvenida */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        /* Decoraciones de stickers virtuales */
        .sticker {
            font-size: 2rem;
            display: inline-block;
            margin: 0 10px;
            animation: flotar 3s ease-in-out infinite alternate;
        }

        /* El súper botón de Discord */
        .boton-discord {
            display: inline-block;
            background-color: #5865F2; /* Color Discord */
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 50px;
            border: 4px solid #404eed;
            box-shadow: 0px 6px 0px #2f3ab2; /* Efecto 3D */
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Efectos del botón */
        .boton-discord:hover {
            transform: translateY(3px);
            box-shadow: 0px 3px 0px #2f3ab2;
            background-color: #4752c4;
        }

        .boton-discord:active {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #2f3ab2;
        }

        /* Animación para que los stickers floten */
        @keyframes flotar {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- Stickers divertidos arriba -->
        <div>
            <span class="sticker" style="animation-delay: 0s;">🚀</span>
            <span class="sticker" style="animation-delay: 0.5s;">🎨</span>
            <span class="sticker" style="animation-delay: 1s;">🤖</span>
        </div>

        <h1>Impresiones 3D :D</h1>
        <div class="subtitulo">¡Hecho para todos, grandes y chicos! 🌍</div>
        
        <p>
            ¡Hola! Esta es mi página web oficial de Impresiones 3D. Aquí comparto mis cosas favoritas, 
            mis proyectos y todo lo que me divierte crear. ¡Explora todo lo que quieras!
        </p>

        <!-- Este enlace abre la aplicación de Discord directamente -->
        <a href="discord://" class="boton-discord">
            💬 Comunícate conmigo
        </a>

        <!-- Stickers abajo -->
        <div style="margin-top: 30px;">
            <span class="sticker" style="animation-delay: 0.2s;">⭐</span>
            <span class="sticker" style="animation-delay: 0.7s;">🌀</span>
            <span class="sticker" style="animation-delay: 1.2s;">🎮</span>
        </div>
    </div>

</body>
</html>
